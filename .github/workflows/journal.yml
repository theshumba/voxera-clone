name: Sync the lodge journal
on:
  schedule:
    - cron: '47 8 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: lodge-journal
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/sync-journal.mjs
      - name: Save the journal
        run: |
          git config user.name "LodgeHelm journal"
          git config user.email "publisher@users.noreply.github.com"
          git add journal
          if ! git diff --cached --quiet; then
            git commit -m "Refresh published lodge journal"
            git push origin HEAD:main
          fi
      - name: Build the existing Pages site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/theshumba/voxera-clone/pages/builds
